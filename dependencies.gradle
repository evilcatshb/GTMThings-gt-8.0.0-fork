dependencies {
    compileOnly libs.jetbrains.annotations

    // GregTech: production fork build (SRG names) resolved from the flatDir repo pointing at libs/.
    // modImplementation lets ModDevGradle remap the jar - and its jarjar'd contents - from SRG to
    // Mojang names. flatDir has no POM metadata, so this is never transitive.
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_build_version}")

    // ModularUI, Registrate and Configuration are jarjar'd inside GTCEu (and get remapped along with
    // it at runtime), but the compiler cannot see classes nested inside jars, so we declare them
    // explicitly: ModularUI is compile-only (GTCEu always provides it at runtime), while Registrate
    // and Configuration come from flatDir via modImplementation so they get SRG->Mojang remapped too.
    compileOnly(fileTree(dir: 'libs', includes: ['modularui-*.jar']))
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}")

    // Production jars resolved from Maven so MDG can remap them from SRG to Mojang names
    modImplementation("appeng:appliedenergistics2-forge:15.4.10")
    modImplementation("appeng:guideme:20.1.15")
    modImplementation("dev.architectury:architectury-forge:9.2.14")
    modImplementation("dev.ftb.mods:ftb-library-forge:2001.2.10")
    modImplementation("dev.ftb.mods:ftb-teams-forge:2001.3.1")
    modImplementation("dev.emi:emi-forge:1.1.24+1.20.1")
    modImplementation("curse.maven:jade-324717:5390389")
    modImplementation("mezz.jei:jei-1.20.1-forge:15.20.0.129")

    // Mixin Extras (provided at runtime by GTCEu's jarjar)
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.2-beta.4"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.2-beta.4"))
    api(annotationProcessor("io.github.llamalad7:mixinextras-common:$project.mixinextras_version"))
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}
